name: Deploy Frontend → Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_DOCS_API_URL: ${{ secrets.NEXT_PUBLIC_DOCS_API_URL || 'https://docs.chirru.in/api/v2' }}
          DOCS_API_URL: ${{ secrets.DOCS_API_URL || 'https://docs.chirru.in/api/v2' }}

      - name: Build for Cloudflare (OpenNext)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_DOCS_API_URL: ${{ secrets.NEXT_PUBLIC_DOCS_API_URL || 'https://docs.chirru.in/api/v2' }}
          DOCS_API_URL: ${{ secrets.DOCS_API_URL || 'https://docs.chirru.in/api/v2' }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: frontend
