spring:
  application:
    name: portfolio-backend
  datasource:
    url: ""
    username: ""
    password: ""
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 60000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v2

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
     allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  cookie:
    secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  bootstrap-admin:
    email: ""
    password: ""
