services:
  postgres:
    image: postgres:16-alpine
    container_name: chirru-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chirru_portfolio
      POSTGRES_USER: chirru
      POSTGRES_PASSWORD: chirru26
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirru -d chirru_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
